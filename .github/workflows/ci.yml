name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    # The Redis bus tests run against a real server rather than a fake — the
    # guarantee they check (sequence allocation across processes) is a property
    # of Redis, so a fake would be checking my own assumptions.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6399:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        # `engines` claims >=20. Test the boundary and current LTS, so the
        # claim is enforced rather than asserted.
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # typecheck + tests + doc links, the same command contributors run.
      - run: npm run check

      - run: npm run build

      # The published surface is dist/. A build that emits no types breaks
      # every consumer while every test still passes.
      - name: Verify the published entry points exist
        run: node scripts/check-exports.mjs
